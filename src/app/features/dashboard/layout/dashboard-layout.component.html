    <div class="collapse navbar-collapse" id="navbarDashboard">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          </a>
        </li>

        <li class="nav-item"
            *ngIf="usuario?.rol === 'ADMIN' || usuario?.rol === 'USER'">
          <a class="nav-link"
             routerLink="/dashboard/laboratorios"
             routerLinkActive="active">
            Laboratorios
          </a>
        </li>

        <li class="nav-item"
            *ngIf="usuario?.rol === 'ADMIN' || usuario?.rol === 'USER'">
          <a class="nav-link"
             routerLink="/dashboard/resultados"

          </a>
