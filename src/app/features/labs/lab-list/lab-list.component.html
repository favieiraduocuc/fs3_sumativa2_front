<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Laboratorios registrados CLI I</h3>

    <a class="btn btn-success" routerLink="/dashboard/laboratorios/nuevo">
      + Nuevo laboratorio
    </a>
  </div>

  <div *ngIf="(error$ | async) as err" class="alert alert-warning mt-3">
    {{ err }}
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle mt-3">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Dirección</th>
          <th>Teléfono</th>
          <th>Estado</th>
          <th style="width: 140px;">Acción</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let lab of (laboratorios$ | async) ?? []">
          <td>{{ lab.idLab }}</td>
          <td>{{ lab.nombre }}</td>
          <td>{{ lab.direccion }}</td>
          <td>{{ lab.telefono || '-' }}</td>

          <td>
            <span class="badge" [ngClass]="lab.activo ? 'bg-success' : 'bg-secondary'">
              {{ lab.activo ? 'Activo' : 'Inactivo' }}
            </span>
          </td>

          <td>
            <button
              class="btn btn-sm btn-outline-warning"
              *ngIf="lab.activo"
              (click)="desactivar(lab)">
              Desactivar
            </button>

            <button
              class="btn btn-sm btn-outline-success"
              *ngIf="!lab.activo"
              (click)="activar(lab)">
              Activar
            </button>
          </td>
        </tr>

        <tr *ngIf="((laboratorios$ | async)?.length ?? 0) === 0">
          <td colspan="6" class="text-center text-muted">
            No hay laboratorios registrados.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
