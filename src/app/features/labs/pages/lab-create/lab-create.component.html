<div class="container">
  <h2>Ingresar laboratorio</h2>

  <div class="alert alert-danger" *ngIf="(error$ | async) as err">
    {{ err }}
  </div>

  <form [formGroup]="form" (ngSubmit)="guardar()">

    <label>Nombre</label>
    <input class="form-control" formControlName="nombre" />

    <label class="mt-2">Dirección</label>
    <input class="form-control" formControlName="direccion" />

    <label class="mt-2">Teléfono</label>
    <input class="form-control" formControlName="telefono" />

    <div class="mt-2">
      <label>
        <input type="checkbox" formControlName="activo" />
        Activo
      </label>
    </div>

    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-primary" type="submit" [disabled]="form.invalid">
        Guardar
      </button>
    </div>

  </form>
</div>
