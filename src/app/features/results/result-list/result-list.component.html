<div class="container py-4">

  <h4 class="mb-3">Resultados de análisis</h4>
  <small class="text-muted d-block mb-4">
    Resultados emitidos por los laboratorios registrados
  </small>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>Paciente</th>
              <th>Laboratorio</th>
              <th>Tipo de examen</th>
              <th>Fecha</th>
              <th class="text-center">Estado</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of resultados">
              <td>{{ r.paciente }}</td>
              <td>{{ r.laboratorio }}</td>
              <td>{{ r.tipo }}</td>
              <td>{{ r.fechaResultado | date }}</td>
              <td class="text-center">
                <span class="badge"
                  [ngClass]="{
                    'bg-warning text-dark': r.estado === 'PENDIENTE',
                    'bg-info text-dark': r.estado === 'PROCESADO',
                    'bg-success': r.estado === 'ENTREGADO'
                  }">
                  {{ r.estado }}
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>
