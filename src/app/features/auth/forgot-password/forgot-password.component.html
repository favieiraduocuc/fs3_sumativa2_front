<div class="d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-sm card-forgot">
    <div class="card-body">
      <h4 class="card-title mb-3 text-center">¿Olvidaste tu contraseña?</h4>
      <p class="text-muted text-center mb-4">
        Ingresa tu correo electrónico y te enviaremos instrucciones de recuperación.
      </p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" formControlName="correo" class="form-control" />
          <div class="text-danger small"
               *ngIf="f['correo'].touched && f['correo'].invalid">
            Debes ingresar un correo válido.
          </div>
        </div>

        <div *ngIf="mensajeExito" class="alert alert-success small">
          Se ha enviado un enlace de recuperación a tu correo.
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2">
          Enviar correo de recuperación
        </button>

        <div class="text-center mt-3">
          <a routerLink="/login" class="small">Volver al inicio de sesión</a>
        </div>
      </form>
    </div>
  </div>
</div>
