<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Resultados</h3>
  </div>

  <div class="alert alert-info" *ngIf="(cargando$ | async)">
    Cargando resultados...
  </div>

  <div class="alert alert-danger" *ngIf="(error$ | async) as err">
    {{ err }}
  </div>

  <div class="table-responsive" *ngIf="!(cargando$ | async)">
    <table class="table table-striped align-middle">
      <thead>
        <tr>
          <th>ID</th>
          <th>Lab</th>
          <th>Usuario</th>
          <th>Descripción</th>
          <th>Resultado</th>
          <th>Fecha</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let r of (resultados$ | async) ?? []">
          <td>{{ r.idResultado }}</td>
          <td>{{ r.idLab }}</td>
          <td>{{ r.idUsuario }}</td>
          <td>{{ r.descripcion }}</td>
          <td>{{ r.resultado }}</td>
          <td>{{ r.fechaAnalisis }}</td>
        </tr>

        <tr *ngIf="((resultados$ | async)?.length ?? 0) === 0 && !(cargando$ | async)">
          <td colspan="6" class="text-center text-muted">
            No hay resultados registrados.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
